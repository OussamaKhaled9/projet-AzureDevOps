trigger: 
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - '**/*.md'
      - 'docs/**'

pr:
  branches:
    include:
      - main
      - develop

variables:
  MAVEN_OPTS: '-Xmx1024m'
  DOCKERHUB_REPOSITORY: '$(DOCKERHUB_USERNAME)/gestion-signalement'
  IMAGE_NAME: 'gestion-signalement'
  IMAGE_TAG: '$(Build.BuildId)'

# 🚨 IMPORTANT: SELF-HOSTED AGENT (NOT ubuntu-latest)
pool:
  name: Default   # <-- your VM agent pool

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: 'Build & Tests'
  jobs:
    - job: MavenBuild
      displayName: 'Compilation + Tests'
      services:
        mysql:
          image: mysql:5.7
          env:
            MYSQL_DATABASE: signalementDb
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin123
            MYSQL_ROOT_PASSWORD: root123
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h localhost -u admin -padmin123"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=10
            --health-start-period=30s

      steps:
        - task: JavaToolInstaller@0
          inputs:
            versionSpec: '8'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: Cache@2
          inputs:
            key: 'maven | "$(Agent.OS)" | **/pom.xml'
            restoreKeys: |
              maven | "$(Agent.OS)"
              maven
            path: '$(HOME)/.m2/repository'

        - task: Maven@3
          displayName: 'mvn clean verify'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'clean verify'
            options: '-Dmaven.test.failure.ignore=false'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
          env:
            SPRING_DATASOURCE_URL: 'jdbc:mysql://localhost:3306/signalementDb?createDatabaseIfNotExist=true'
            SPRING_DATASOURCE_USERNAME: 'admin'
            SPRING_DATASOURCE_PASSWORD: 'admin123'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: 'target/gestion-signalement.jar'
            ArtifactName: 'jar-artifact'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: 'k8s'
            ArtifactName: 'k8s-manifests'

# =========================
# CODE ANALYSIS
# =========================
- stage: CodeAnalysis
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: StaticAnalysis
      steps:
        - task: Maven@3
          displayName: 'Checkstyle'
          inputs:
            goals: 'checkstyle:checkstyle'

        - task: Maven@3
          displayName: 'SpotBugs'
          inputs:
            goals: 'compile spotbugs:spotbugs'

# =========================
# DOCKER BUILD
# =========================
- stage: DockerBuild
  dependsOn: CodeAnalysis
  condition: |
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/develop')
      )
    )
  variables:
    - group: dockerhub-config

  jobs:
    - job: Docker
      steps:

        - task: Maven@3
          inputs:
            goals: 'package'
            options: '-DskipTests'

        - task: Docker@2
          inputs:
            containerRegistry: 'DockerHubConnectionService'
            repository: '$(DOCKERHUB_REPOSITORY)'
            command: 'buildAndPush'
            Dockerfile: 'Dockerfile'
            tags: |
              $(IMAGE_TAG)
              latest

# =========================
# DEPLOY (LOCAL K3S)
# =========================
- stage: Deploy
  dependsOn: DockerBuild
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

  variables:
    - group: db-config

  jobs:
    - deployment: DeployToK3s
      environment: production
      pool:
        name: Default   # 👈 SELF-HOSTED AGENT ON YOUR VM

      strategy:
        runOnce:
          deploy:
            steps:

              - task: DownloadBuildArtifacts@1
                inputs:
                  buildType: 'current'
                  artifactName: 'k8s-manifests'
                  downloadPath: '$(System.ArtifactsDirectory)'

              # =========================
              # VERIFY CLUSTER ACCESS
              # =========================
              - script: |
                  echo "User: $(whoami)"
                  kubectl get nodes
                displayName: 'Check K3s connection'

              # =========================
              # NAMESPACE + SECRET
              # =========================
              - script: |
                  kubectl create namespace signalement \
                    --dry-run=client -o yaml | kubectl apply -f -

                  kubectl create secret generic db-secret \
                    --namespace=signalement \
                    --from-literal=datasource-url="$(DB_URL)" \
                    --from-literal=datasource-username="$(DB_USER)" \
                    --from-literal=datasource-password="$(DB_PASSWORD)" \
                    --dry-run=client -o yaml | kubectl apply -f -
                displayName: 'Create namespace & secrets'

              # =========================
              # MYSQL
              # =========================
              - script: |
                  kubectl apply -f $(System.ArtifactsDirectory)/k8s-manifests/mysql.yml
                  kubectl rollout status deployment/mysql -n signalement --timeout=120s
                displayName: 'Deploy MySQL'

              # =========================
              # APPLICATION
              # =========================
              - script: |
                  export IMAGE_TAG=$(Build.BuildId)
                  export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)

                  envsubst < $(System.ArtifactsDirectory)/k8s-manifests/deployment.yml | kubectl apply -f -

                  kubectl rollout status deployment/gestion-signalement -n signalement --timeout=300s
                displayName: 'Deploy App'

              # =========================
              # SMOKE TEST
              # =========================
              - script: |
                  URL="http://localhost:30080/aec-api-rest/actuator/health"

                  for i in $(seq 1 10); do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                    echo "Attempt $i -> $STATUS"

                    if [ "$STATUS" = "200" ]; then
                      echo "OK"
                      exit 0
                    fi

                    sleep 10
                  done

                  exit 1
                displayName: 'Smoke Test'