  - stage: DockerBuild
    displayName: 'Build & Push Image Docker'
    dependsOn: CodeAnalysis
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop')
        )
      )
    variables:
      - group: dockerhub-config
    jobs:
      - job: Docker
        displayName: 'Build Docker et push vers Docker Hub'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '8'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: '$(HOME)/.m2/repository'
          - task: Maven@3
            displayName: 'Package JAR (skip tests)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package'
              options: '-DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
          - task: Docker@2
            displayName: 'Build & Push image vers Docker Hub'
            inputs:
              containerRegistry: 'DockerHubConnectionService'
              repository: '$(DOCKERHUB_REPOSITORY)'
              command: 'buildAndPush'
              Dockerfile: 'Dockerfile'
              buildContext: '.'
              tags: |
                $(IMAGE_TAG)
                latest
          - task: PublishBuildArtifacts@1
            displayName: 'Publier manifests K8s'
            inputs:
              PathtoPublish: 'k8s'
              ArtifactName: 'k8s-manifests'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploiement Kubernetes'
    dependsOn: DockerBuild
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    variables:
      - group: dockerhub-config
      - group: aks-config
      - group: db-config
    jobs:
      - deployment: DeployToAKS
        displayName: 'Deployer sur K8s local'
        environment: 'production'
        pool:
          name: 'Default'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: 'Telecharger manifests K8s'
                  inputs:
                    buildType: 'current'
                    artifactName: 'k8s-manifests'
                    downloadPath: '$(System.ArtifactsDirectory)'
                - task: Bash@3
                  displayName: 'Configurer kubectl'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=/home/oussama/.kube/config
                      kubectl version
                      kubectl get nodes
                - task: Bash@3
                  displayName: 'Creer namespace et secret DB'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=/home/oussama/.kube/config
                      kubectl create namespace signalement --dry-run=client -o yaml | kubectl apply -f -
                      kubectl create secret generic db-secret \
                        --namespace=signalement \
                        --from-literal=datasource-url="$(DB_URL)" \
                        --from-literal=datasource-username="$(DB_USER)" \
                        --from-literal=datasource-password="$(DB_PASSWORD)" \
                        --dry-run=client -o yaml | kubectl apply -f -
                - task: Bash@3
                  displayName: 'Deployer MySQL'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=/home/oussama/.kube/config
                      kubectl apply -f $(System.ArtifactsDirectory)/k8s-manifests/mysql.yml
                      kubectl rollout status deployment/mysql -n signalement --timeout=120s
                - task: Bash@3
                  displayName: 'Deployer application'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=/home/oussama/.kube/config
                      export DOCKERHUB_REPOSITORY=$(DOCKERHUB_REPOSITORY)
                      export IMAGE_TAG=$(Build.BuildId)
                      cat $(System.ArtifactsDirectory)/k8s-manifests/deployment.yml | envsubst | kubectl apply -f -
                      kubectl rollout status deployment/gestion-signalement -n signalement --timeout=300s
                - task: Bash@3
                  displayName: 'Smoke test'
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=/home/oussama/.kube/config
                      NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')
                      URL="http://${NODE_IP}:30080/aec-api-rest/actuator/health"
                      echo "Test : $URL"
                      for i in $(seq 1 10); do
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                        if [ "$STATUS" = "200" ]; then
                          echo "OK"
                          exit 0
                        fi
                        echo "Tentative $i/10 - HTTP $STATUS"
                        sleep 15
                      done
                      exit 1